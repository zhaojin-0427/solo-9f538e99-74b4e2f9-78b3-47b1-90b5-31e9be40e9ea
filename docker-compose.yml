services:
  log-service:
    build: .
    image: sorting-log-service:latest
    container_name: sorting-log-service
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      MAX_UPLOAD_BYTES: "104857600"
      REAP_WAIT_SECONDS: "30"
    volumes:
      - log-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  log-data:
